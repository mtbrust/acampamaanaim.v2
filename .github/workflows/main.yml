on: 
  push:
    branches:
      - main
name: 🚀 Deploy Hostgator
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.acampamaanaim_ftp_host }}
        username: ${{ secrets.acampamaanaim_ftp_username }}
        password: ${{ secrets.acampamaanaim_ftp_password }}
